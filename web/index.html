<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" id="theme-color" />
    <meta name="darkreader-lock" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      // Set theme + loading background before first paint. Prevents flash.
      // Devs: change the colors below to match your app's brand.
      // Sleep Sounds is dark by default (it's used in the dark). The first
      // visit stores 'dark' as the theme so the Shell's toggle agrees; after
      // that, the user's choice from the toggle wins.
      var t = null;
      try {
        t = localStorage.getItem('stores-theme');
        if (!t) { t = 'dark'; localStorage.setItem('stores-theme', t); }
      } catch (e) { t = 'dark'; }
      var d = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      if (d) document.documentElement.dataset.theme = 'dark';
      document.documentElement.style.background = d ? '#000000' : '#ffffff';
    </script>
    <title>Sleep Sounds — FreeAppStore</title>
    <meta name="description" content="White noise, rain, ocean and more, generated on your device. Mix sounds and set each one's volume." />
    <!-- Platform analytics loader. CF Web Analytics is auto-provisioned at publish;
         GA4 / Plausible / custom <head> are opt-in via PUT /v1/apps/sleepsounds/analytics. -->
    <script src="https://api.freeappstore.online/v1/analytics.js?app=sleepsounds" defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
